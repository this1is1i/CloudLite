[package]
name = "cloudlite"
version = "0.1.0"
edition = "2021"
description = "A local-first native Windows NetEase music player"
license = "MIT"

[dependencies]
anyhow = "1"
aes = "0.8"
ecb = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
walkdir = "2"
tempfile = "3"
qrcode = { version = "0.14", default-features = false }
url = "2"
ncm-api-rs = { path = "vendor/ncm-api-rs" }
tokio = { version = "1", features = ["rt", "time"] }
windows = { version = "=0.61.3", features = [
  "Foundation", "Media_Core", "Media_Playback", "Media", "Storage",
  "Storage_FileProperties", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_WinRT",
  "Win32_System_Memory", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_Graphics_GdiPlus",
  "Win32_System_ProcessStatus", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_SystemInformation"
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
